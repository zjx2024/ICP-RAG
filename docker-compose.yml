# ===== ICP_RAG 新一代版本：独立基础设施（与 RAG_Agent_v1.0 端口完全隔离）=====
# 宿主机端口映射：postgres 5433 / ES 9201 / minio 9002+9003 / hugegraph 8082 / hubble 18089 / app 19999
# 不写死 container_name：由 `-p icp` 自动生成 icp-<service>-1，避免与历史遗留容器重名
# 热启动（源码）请使用 ./start_server.sh（uvicorn --reload，监听 19999）
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: knowledge_graph
    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - icp-network

  elasticsearch:
    image: elasticsearch:8.14.0
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
    volumes:
      - ./volumes/es:/usr/share/elasticsearch/data
    ports:
      - "9201:9200"
      - "9301:9300"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q 'green\\|yellow'"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - icp-network

  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
    volumes:
      - ./volumes/minio:/data
    ports:
      - "9002:9000"
      - "9003:9001"
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - icp-network

  hugegraph:
    image: hugegraph/hugegraph:latest
    ports:
      - "8082:8080"
    volumes:
      # HugeGraph 实际数据目录是 /hugegraph-server/rocksdb-data（镜像 VOLUME 声明点）
      # 必须挂载到该路径才能持久化数据，挂到 /graphdata 是无效的（旧配置导致重启丢数据）
      - ./volumes/hugegraph:/hugegraph-server/rocksdb-data
    environment:
      HUGEGRAPH_HOME: /hugegraph-server
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:8080/graphs/hugegraph"]
      interval: 10s
      timeout: 10s
      retries: 20
    networks:
      - icp-network

  hubble:
    image: hugegraph/hubble:latest
    ports:
      - "18089:8088"
    environment:
      HUGEGRAPH_SERVERS: http://hugegraph:8080
    depends_on:
      hugegraph:
        condition: service_healthy
    networks:
      - icp-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "19999:9999"
    # .env 中所有变量都会注入容器，修改 .env 即可调整配置
    # environment 中的值会覆盖 env_file，用于容器内部网络寻址
    env_file:
      - .env
    environment:
      # 容器内部网络寻址（覆盖 .env 中的 localhost 值）
      ES_HOST: elasticsearch
      MINIO_ENDPOINT: minio:9000
      POSTGRES_HOST: postgres
      HUGEGRAPH_HOST: hugegraph
      HUGEGRAPH_PORT: 8080

      # 图片目录必须指向挂载点 /app/storage/images（默认会解析为镜像内 /app/app/storage/images，
      # 导致静态服务读到镜像旧目录、解析产物写入容器可写层，容器重建即丢失）
      IMAGE_STORAGE_DIR: /app/storage/images

      # 服务器局域网 IP，由 start.sh 自动检测写入 .env
      SERVER_IP: ${SERVER_IP:-}
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      minio:
        condition: service_healthy
      hugegraph:
        condition: service_healthy
    # 图片持久化：解析产物图片必须挂载宿主机目录，否则重建容器/镜像即丢失（画廊/检索图片 404）
    volumes:
      - ./app/storage/images:/app/storage/images
    # 代码已打进镜像（Dockerfile COPY . .），无需 bind mount 代码
    # 这样镜像 + volumes/ 即可完整移植（Dify 式部署）
    networks:
      - icp-network

networks:
  icp-network:
    driver: bridge