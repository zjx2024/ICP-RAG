# ===== ICP_RAG 新一代版本：独立基础设施（与 RAG_Agent_v1.0 端口完全隔离）=====
# 宿主机端口映射：postgres 5433 / OpenSearch 9201 / hugegraph 8082 / hubble 18089 / app 19999
# 原始文档和工程图由 app 内 ArtifactStore + LocalFS 管理，不再运行 MinIO 服务。
# OpenSearch 同时承载 CJK BM25 全文索引与 BGE-M3 1024 维向量索引；不引入 Milvus。
# 不写死 container_name：由 `-p icp` 自动生成 icp-<service>-1，避免与历史遗留容器重名
# 热启动（源码）请使用 ./start_server.sh（uvicorn --reload，监听 19999）
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-knowledge_graph}
    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-knowledge_graph}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: *default-logging
    networks:
      - icp-network

  opensearch:
    image: opensearchproject/opensearch:3.6.0
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g
    volumes:
      - ./volumes/opensearch:/usr/share/opensearch/data
    ports:
      - "9201:9200"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health | grep -q 'green\\|yellow'"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 40s
    restart: unless-stopped
    logging: *default-logging
    networks:
      - icp-network

  hugegraph:
    image: hugegraph/hugegraph:1.7.0
    ports:
      - "8082:8080"
    volumes:
      # HugeGraph 实际数据目录是 /hugegraph-server/rocksdb-data（镜像 VOLUME 声明点）
      # 必须挂载到该路径才能持久化数据，挂到 /graphdata 是无效的（旧配置导致重启丢数据）
      - ./volumes/hugegraph:/hugegraph-server/rocksdb-data
    environment:
      HUGEGRAPH_HOME: /hugegraph-server
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:8080/graphs/hugegraph"]
      interval: 10s
      timeout: 10s
      retries: 20
    restart: unless-stopped
    logging: *default-logging
    networks:
      - icp-network

  hubble:
    image: hugegraph/hubble:1.7.0
    ports:
      - "18089:8088"
    environment:
      HUGEGRAPH_SERVERS: http://hugegraph:8080
    depends_on:
      hugegraph:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    networks:
      - icp-network

  app:
    # 固定镜像名，确保离线导出/导入后 `compose up` 能直接复用应用镜像。
    image: knowledge-graph-app:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "19999:9999"
    # 与宿主机源码热启动使用同一 UID/GID，避免 bind mount 中产生
    # root:root 0750 文件后普通用户无法继续解析或回收。
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    # .env 可选；不存在时使用安全的本地开发默认值。
    # environment 中的值会覆盖 env_file，用于容器内部网络寻址
    env_file:
      - path: .env
        required: false
    environment:
      # 容器内部网络寻址（覆盖 .env 中的 localhost 值）
      OPENSEARCH_HOST: opensearch
      OPENSEARCH_PORT: 9200
      OPENSEARCH_SCHEME: http
      OPENSEARCH_VERIFY_CERTS: "false"
      OPENSEARCH_INDEX_ALIAS: ${OPENSEARCH_INDEX_ALIAS:-knowledge_graph_default}
      OPENSEARCH_INDEX_VERSION: ${OPENSEARCH_INDEX_VERSION:-v1}
      STRICT_DEPENDENCIES: "true"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-knowledge_graph}
      HUGEGRAPH_HOST: hugegraph
      HUGEGRAPH_PORT: 8080

      # 本地 ArtifactStore 挂载点。/images 只暴露其 images 子目录，
      # 原始文档等其他对象不会被静态服务公开。
      ARTIFACT_BACKEND: local
      ARTIFACT_STORAGE_DIR: /app/data/artifacts
      ARTIFACT_TRASH_ENABLED: "true"
      IMAGE_STORAGE_DIR: /app/data/artifacts/images

      # 服务器局域网 IP，由 start.sh 自动检测写入 .env
      SERVER_IP: ${SERVER_IP:-}
      HOME: /tmp
      PYTHONDONTWRITEBYTECODE: "1"
    depends_on:
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      hugegraph:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9999/livez', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    logging: *default-logging
    # 原件、解析产物和工程图证据统一持久化。
    volumes:
      - ./volumes/artifacts:/app/data/artifacts
    # 代码已打进镜像（Dockerfile COPY . .），无需 bind mount 代码
    # 这样镜像 + volumes/ 即可完整移植（Dify 式部署）
    networks:
      - icp-network

networks:
  icp-network:
    driver: bridge
