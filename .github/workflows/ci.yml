name: ICP-RAG CI

on:
  push:
    branches:
      - main
      - refactor/**
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend syntax and domain tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Check undefined names and duplicate literal keys
        run: ruff check --select F821,F822,F823,F601 backend scripts tests

      - name: Validate regression and judge-calibration files offline
        run: |
          python -m scripts.audit_icp_eval_suite
          python -m scripts.calibrate_icp_judge --validate-only

      - name: Compile Python sources
        run: python -m compileall -q backend

      - name: Run deterministic ICP tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Verify ICP routers are mounted
        run: |
          python - <<'PY'
          from pathlib import Path
          api_init = Path('backend/api/__init__.py').read_text(encoding='utf-8')
          for name in ('types_router', 'icp_domain_router', 'documents_router'):
              assert name in api_init, f'ICP router not mounted: {name}'
          assert not Path('backend/api/routers/dify.py').exists(), 'retired Dify router must stay removed'
          print('ICP routers mounted; generic/Dify legacy routes remain retired')
          PY

  frontend:
    name: Frontend TypeScript build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test diagnosis streaming contracts
        run: npm test
