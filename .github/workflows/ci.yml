name: ICP-RAG CI

on:
  push:
    branches:
      - main
      - refactor/**
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend syntax and domain tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile Python sources
        run: python -m compileall -q backend

      - name: Run deterministic ICP tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Verify Dify compatibility route is retained
        run: |
          python - <<'PY'
          from pathlib import Path
          api_init = Path('backend/api/__init__.py').read_text(encoding='utf-8')
          dify = Path('backend/api/routers/dify.py')
          assert dify.exists(), 'Dify router was removed'
          assert 'dify_router' in api_init and 'include_router(dify_router' in api_init, 'Dify router is not mounted'
          print('Dify compatibility route retained')
          PY

  frontend:
    name: Frontend TypeScript build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
