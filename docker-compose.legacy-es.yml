# Optional, isolated reader for a COPY of the retired Elasticsearch data.
# Never point this service at the only copy of volumes/es.  The current app does
# not depend on it; PostgreSQL and ArtifactStore are used to rebuild OpenSearch.
services:
  legacy-elasticsearch:
    image: elasticsearch:8.14.0
    profiles: ["legacy-migration"]
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - ${LEGACY_ES_DATA_DIR:-./volumes/es-migration-copy}:/usr/share/elasticsearch/data
    ports:
      - "127.0.0.1:9202:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health | grep -q 'green\\|yellow'"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s
